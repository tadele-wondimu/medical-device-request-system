<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hospital-logo {
            max-width: 150px;
            margin: 20px auto;
            display: block;
        }
        
        .hospital-name {
            text-align: center;
            color: #007bff;
            font-size: 2.5rem;
            margin: 20px 0;
        }
        
        .form-subheading {
            text-align: center;
            color: #555;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        /* Matching index page button styles */
        .btn-index {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }

        .btn-index:hover {
            background-color: #0056b3;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>
<body>
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Hospital Logo" class="hospital-logo">
    <h1 class="hospital-name">Eka Kotebe General Hospital</h1>
    <h2 class="form-subheading">Biomedical Deparment Admin Login</h2> <!-- Don't change the word Biomedical Deparment Admin Login-->

    <div class="container" style="max-width: 400px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            
            <!-- Go Back button -->
            <a href="{{ url_for('index') }}" class="btn-index w-100 text-center">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
        </form>
    </div>

    <!-- Add Font Awesome for the arrow icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
